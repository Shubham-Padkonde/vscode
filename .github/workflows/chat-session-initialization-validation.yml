name: Chat session initialization regression validation
on:
  push:
    branches: [ci/chat-session-initialization-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  electron-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      npm_config_arch: x64
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c82acc14522636659715fa07f52515577e6afdcb
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm
      - name: Install system dependencies
        run: |
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y pkg-config xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install build dependencies
        run: pnpm --dir build install --frozen-lockfile --ignore-workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies using upstream Linux toolchain
        run: |
          source ./build/azure-pipelines/linux/setup-env.sh
          pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Transpile client and download Electron
        run: |
          pnpm run build-fast --client-only
          pnpm run electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint changed source and tests
        run: pnpm run eslint src/vs/workbench/contrib/chat/browser/chatSessions/chatSessions.contribution.ts src/vs/workbench/contrib/chat/test/browser/chatSessions/chatSessionsService.test.ts
      - name: Run chat session suite with fix
        run: |
          xvfb-run -a ./scripts/test.sh --runGlob '**/browser/chatSessions/chatSessionsService.test.js' --tfs chat-sessions-fixed
      - name: Prove failed-startup recovery fails on unchanged source
        run: |
          source_file=src/vs/workbench/contrib/chat/browser/chatSessions/chatSessions.contribution.ts
          git show HEAD^2:"$source_file" > "$source_file"
          pnpm run build-fast --client-only
          set +e
          xvfb-run -a ./scripts/test.sh --runGlob '**/browser/chatSessions/chatSessionsService.test.js' --grep 'retries a failed startup refresh when listing sessions' --tfs chat-sessions-baseline
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('test-results/linux-x64-chat-sessions-baseline-results.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 1, [(case.attrib, list(case)) for case in cases]
          for case in cases:
              failure = case.find('failure')
              assert failure is not None, case.attrib
              assert 'Recovered session' in (failure.text or ''), failure.text
          print('Startup recovery regression fails on baseline with empty items.')
          PY
          git restore --source=HEAD -- "$source_file"
          git diff --exit-code
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-session-test-results
          path: test-results/
          if-no-files-found: warn
